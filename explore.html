<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#eae1ba">
  <link href="https://fonts.googleapis.com/css2?family=Bellefair&display=swap" rel="stylesheet">
  <meta name="msapplication-TileColor" content="#eae1ba">
  <meta name="theme-color" content="#eae1ba">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VPEJEZQ17H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-VPEJEZQ17H');
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('serviceworker.js');
    };
  </script>
  <style>
    :root {
      /* define these values through JS */
      --margin-1: 2px;
      --margin-2: 4px;
      --margin-3: 8px;
      --margin-4: 12px;
      --margin-5: 16px;
      --margin-6: 24px;
      --margin-7: 32px;
      --margin-8: 48px;
      --margin-9: 64px;
      --black: #534b3e;
      --red: #d65d55;
      --body: #e6cda1;
      --breakpoint-1: 600px;
      --height-header: 29px;
      --oceanOpacity: 0.45;
      --countryOpacity: 0.06;
      --body: #e6d5b9;
      --ocean: #e6d5b9;
      --countryLabel: #534b3e;
      --seaLabel: #534b3e;
      --cityLabel: #534b3e;
      --mountains: #534b3e;
      --outsideBorder: #4d4c4c;
      --graticule: #b1b1b1;
      --selectedCity: #d65d55;
      --rivers: #146b8d;
      --framework: #534b3e;
      --black: #534b3e;
      --border-0: #6e8547;
      --border-1: #e0bc4a;
      --border-2: #a81f1f;
      --border-3: #4b5c91;
      --border-4: #654951;
      --border-5: #da7210;
      --border-6: #ac9e9d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: var(--black);
    }

    html,
    body {
      background-color: var(--body);
      width: 100vw;
      overflow-x: hidden;
    }

    main {
      font-family: Arial, Helvetica, sans-serif;
      width: 100vw;
      height: calc(100vh - 26px);
      position: relative;
    }

    .svg_wrapper {
      width: 100%;
      height: 100%;
      font-family: 'Bellefair';
    }

    #controlsWrapper{
      position: absolute;
      top: 1px;
      background-color: rgba(230, 213, 185, 0.5);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      right: 0;
      box-shadow: -5px 5px 3px rgba(230, 213, 185, 0.5);
      padding: var(--margin-3);
      width: 120px;
    }
    year-select {
      width: 100%;
    }
    year-select label {
      margin: 0px !important;
    }
  </style>
</head>

<body>
  <navigation-header></navigation-header>
  <main>
    <svg data-explore="1" class="svg_wrapper">
    </svg>
    <div id="controlsWrapper">
      <year-select withoutMargin="1"></year-select>
    </div>
  </main>
  <script type="module" src="./scripts/index.js"></script>
</body>
