<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face {
    font-family: "bodoni";
    src:
      url("./fonts/bodoniflf-roman_500-webfont.woff2") format("woff2"),
      url("./fonts/bodoniflf-roman_500-webfont.woff") format("woff");
    font-weight: normal;
  }

  @font-face {
    font-family: system;
    font-style: normal;
    font-weight: 300;
    src: local(".SFNSText-Light"), local(".HelveticaNeueDeskInterface-Light"), local(".LucidaGrandeUI"), local("Ubuntu Light"), local("Segoe UI Light"), local("Roboto-Light"), local("DroidSans"), local("Tahoma");
  }
  :root {
    --margin-1: 2px;
    --margin-2: 4px;
    --margin-3: 8px;
    --margin-4: 12px;
    --margin-5: 16px;
    --margin-6: 32px;
    --margin-7: 48px;
    --margin-8: 64px;
    --body-color: #eae1ba;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  svg {
    background-color: var(--body-color);
  }
  svg * {
    font-family: 'bodoni';
  }

  main {
    font-family: system;
    width: 100vw;
    height: 100vh;
  }

  .svg_wrapper {
    width: 100%;
    height: 100%;
  }

  
  #controlsWrapper {
    position: fixed;
    top: 0;
    background-color: rgba(234, 225, 186, 50%);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    right: 0;
    box-shadow: -5px 5px 3px rgba(234, 225, 186, 50%);
    padding-right: var(--margin-3);
  }
</style>
<!-- 
D3 v5 depeds on Fetch API that does not support local files fetching
To run locally: 
- run python -m SimpleHTTPServer from the folder and then call http://localhost:8000/ in navigator
This might help in other cases of running js scripts locally, but should not be needed with this one:
- In Firefox: disable strict origin control in about:cofig  
- Launch Chrome with /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --disable-web-security --user-data-dir
-->
<main>
  <side-panel></side-panel>
  <svg class="svg_wrapper"></svg>
  <article id="controlsWrapper">
    <year-select></year-select>
    <projection-select></projection-select>
  </article>
</main>
<script src="d3/d3.v5.min.js"></script>
<script src="d3/d3-geo-projection.v2.min.js"></script>
<!-- <script src="d3/topojson.v2.min.js"></script> -->
<script type="module" src="./scripts/index.js"></script>
