<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('serviceworker.js');
    };
  </script>
  <style>
    @font-face {
      font-family: "bodoni";
      src:
        url("./fonts/bodoniflf-roman_500-webfont.woff2") format("woff2"),
        url("./fonts/bodoniflf-roman_500-webfont.woff") format("woff");
      font-weight: normal;
    }

    @font-face {
      font-family: system;
      font-style: normal;
      font-weight: 300;
      src: local(".SFNSText-Light"), local(".HelveticaNeueDeskInterface-Light"), local(".LucidaGrandeUI"), local("Ubuntu Light"), local("Segoe UI Light"), local("Roboto-Light"), local("DroidSans"), local("Tahoma");
    }

    :root { /* define these values through JS */
      --margin-1: 2px;
      --margin-2: 4px;
      --margin-3: 8px;
      --margin-4: 12px;
      --margin-5: 16px;
      --margin-6: 32px;
      --margin-7: 48px;
      --margin-8: 64px;
      --body-color: #eae1ba;
      --black: #534b3e;
      --breakpoint-1: 600px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: var(--black);
    }

    html, body {
      background-color: var(--body-color);
      width: 100vw;
    }

    svg * {
      font-family: 'bodoni';
    }

    main {
      font-family: system;
      width: 100vw;
      height: 100vh;
      overflow-x: hidden;
    }

    .svg_wrapper {
      width: 100%;
      height: 100%;
    }


    #controlsWrapper {
      padding: 0px var(--margin-3);
    }
  </style>
</head>

<body>
  <main>
    <side-panel></side-panel>
    <map-wrapper>
      <svg class="svg_wrapper">
      </svg>
    </map-wrapper>
    <article id="controlsWrapper">
      <year-select></year-select>
      <projection-select></projection-select>
      <title-input></title-input>
      <hide-or-show-toggle labelText="Cities" elementToHideSelector="#cities" ></hide-or-show-toggle>
      <hide-or-show-toggle labelText="Graticule" elementToHideSelector="#graticuleCollection" ></hide-or-show-toggle>
      <hide-or-show-toggle labelText="Rivers" elementToHideSelector="#rivers" ></hide-or-show-toggle>
    </article>
  </main>
  <script type="module" src="./scripts/index.js"></script>
</body>
