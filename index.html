<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#eae1ba">
  <meta name="msapplication-TileColor" content="#eae1ba">
  <meta name="theme-color" content="#eae1ba">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('serviceworker.js');
    };
  </script>
  <style>
    @font-face {
      font-family: "bodoni";
      src:
        url("./fonts/bodoniflf-roman_500-webfont.woff2") format("woff2"),
        url("./fonts/bodoniflf-roman_500-webfont.woff") format("woff");
      font-weight: normal;
    }

    @font-face {
      font-family: "bodoni";
      src:
        url("./fonts/BodoniFLF-Italic-500.ttf") format("ttf");
      font-weight: normal;
      font-style: italic;
    }

    @font-face {
      font-family: system;
      font-style: normal;
      font-weight: 300;
      src: local(".SFNSText-Light"), local(".HelveticaNeueDeskInterface-Light"), local(".LucidaGrandeUI"), local("Ubuntu Light"), local("Segoe UI Light"), local("Roboto-Light"), local("DroidSans"), local("Tahoma");
    }

    :root {
      /* define these values through JS */
      --margin-1: 2px;
      --margin-2: 4px;
      --margin-3: 8px;
      --margin-4: 12px;
      --margin-5: 16px;
      --margin-6: 24px;
      --margin-7: 32px;
      --margin-8: 48px;
      --margin-9: 64px;

      --black: #534b3e;
      --red: #d65d55;
      --breakpoint-1: 600px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: var(--black);
    }

    html,
    body {
      background-color: var(--body);
      width: 100vw;
    }

    svg * {
      font-family: 'Times New Roman';
    }

    main {
      font-family: Arial, Helvetica, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow-x: hidden;
    }

    .svg_wrapper {
      width: 100%;
      height: 100%;
    }

    #buttonWrapper {
      display: flex;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    #buttonWrapper button:nth-child(2) {
      background-color: var(--black);
      color: var(--body);
    }

    button {
      display: block;
      width: 50%;
      appearance: none;
      padding: var(--margin-4) 0px;
      border: 1px solid var(--black);
      background-color: var(--body);
    }

    section {
      position: sticky;
      top: 0;
      padding: var(--margin-3);
      padding-bottom: 0;
      background-color: var(--body);
      z-index: 1;
    }

    #title {
      text-align: center;
      font-family: "bodoni";
      font-size: 20px;
      margin-bottom: var(--margin-1);
      color: var(--black);
    }

    #firstBorder {
      border: 3px solid var(--black);
      padding: var(--margin-2);
      box-sizing: border-box;
    }

    .landscape {
      width: calc(100vw - 36px);
      height: calc((100vw - 36px) / 4 * 3);
    }

    .portrait {
      width: calc(40vh / 4 * 3);
      height: 40vh;
    }

    #secondBorder {
      border: 1px solid var(--black);
      height: calc(100% - 3px);
      background-color: var(--ocean);
    }

    section {
      display: flex;
      justify-content: center;
    }

    @media only screen and (max-width:768px) {
      #mapSection {
        border-bottom: 1px solid var(--black);
        padding-bottom: var(--margin-5);
      }
    }

    @media only screen and (min-width:768px) {
      section {
        width: calc(100vw - 300px);
      }

      #subWrapper {
        height: 100%;
      }

      #firstBorder {
        height: calc(100vh - 55px);
      }
      .landscape {
        width: calc((100vh - 55px) * 4 / 3);
      }
      .portrait {
        width: calc((100vh - 55px) * 3 / 4);
      }


      main {
        display: flex;
      }

      #buttonWrapper {
        background-color: var(--body);
        width: 243px;
        justify-content: space-between;
        box-shadow: 0px -4px 3px var(--body);
      }

      #buttonWrapper button {
        width: calc(50% - (var(--margin-4) / 2));
        margin-bottom: var(--margin-4);
        margin-top: var(--margin-2);
      }
    }

    @media only screen and (max-aspect-ratio: 380/237) and (min-width:768px) {
      .landscape {
        width: calc((100vw - 330px));
        height: calc((100vw - 330px) / 4 * 3) !important;
      }
    }
    @media only screen and (max-aspect-ratio: 500/473) and (min-width:768px) {
      .portrait {
        width: calc((100vw - 330px));
        height: calc((100vw - 330px) / 3 * 4) !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <!-- <side-panel></side-panel> -->
    <section id="mapSection">
      <div id="subWrapper">
        <div id="title">Change me</div>
        <div id="firstBorder" class="landscape">
          <div id="secondBorder">
            <svg class="svg_wrapper">
            </svg>
          </div>
        </div>
      </div>
    </section>
    <customize-section>
      <title-input></title-input>
      <year-select></year-select>
      <radio-map-style></radio-map-style>
      <edit-colors></edit-colors>
      <expand-content>
        <projection-select></projection-select>
        <hide-or-show-toggle labelText="Cities" elementToHideSelector="#cities"></hide-or-show-toggle>
        <hide-or-show-toggle labelText="Graticule" elementToHideSelector="#graticuleCollection"></hide-or-show-toggle>
        <hide-or-show-toggle labelText="Rivers" elementToHideSelector="#rivers"></hide-or-show-toggle>
        <range-map-property labelText="Country border size" mapProperty="borderWidth" value="10" min="0" max="100" step="1"></range-map-property>
        <range-map-property labelText="City name size" mapProperty="citySize" value="2.4" min="0" max="15" step="0.1"></range-map-property>
        <range-map-property labelText="Graticule gap size" mapProperty="graticuleGapSize" value="50" min="5" max="250" step="1"></range-map-property>
        <range-map-property labelText="Graticule line size" mapProperty="graticuleLineSize" value="1" min="0" max="10" step="0.1"></range-map-property>
      </expand-content>
      <radio-map-direction></radio-map-direction>
      <radio-map-sizes></radio-map-sizes>
      <radio-map-material></radio-map-material>
    </customize-section>
    <order-section>
      <text-input name="email" labelText="Email"></text-input>
      <text-input name="name" labelText="Full name"></text-input>
      <text-input name="address" labelText="Address" hintText="Example: Osloweg 35b"></text-input>
      <text-input name="zip" labelText="Postal code"></text-input>
      <text-input name="city" labelText="City"></text-input>
      <country-select></country-select>
    </order-section>
    <checkout-section>
      <img style="position: absolute; left: 0; right: 0; top: 0; margin: auto; margin-top: 20px;" id="#loading"
        src="./loading.svg" />
      <!-- Dynamic -->
    </checkout-section>
    <order-status-section></order-status-section>
  </main>
  <script type="module" src="./scripts/index.js"></script>
  <script>
    window.addEventListener('updateMapTitle', ({ detail: { value }}) => {
      document.getElementById('title').innerText = value;
    })
    window.addEventListener('directionChange', ({ detail: { value }}) => {
      const firstBorder = document.getElementById('firstBorder');
      firstBorder.removeAttribute('class');
      firstBorder.classList.add(value);
    })
  </script>
</body>
